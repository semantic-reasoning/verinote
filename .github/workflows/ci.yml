# SPDX-License-Identifier: MPL-2.0
name: ci

# Lint + test every push to main and every pull request. ruff config lives in
# pyproject.toml ([tool.ruff]); the pytest suite is under tests/.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15.18"   # keep in sync with local dev
          args: check

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Job-level, so it is evaluated once per matrix leg; the legs run
    # concurrently, so a hang costs this bound once per leg, not once.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Include the wirelog extra so pyrewire is present and the DuckDB/wirelog
      # parity tests in tests/test_engine.py actually run instead of being
      # importorskip'd — without it CI green-lights code it never executes.
      - run: pip install -e ".[test,wirelog]"
      - run: pytest -q

  sdk-anchors:
    name: SDK constructor anchors (real anthropic + openai)
    runs-on: ubuntu-latest
    # Installs the vendor SDKs and runs the real-SDK constructor anchors with
    # no provider calls; the bound only matters if the SDK install hangs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The matrix job installs only the test and wirelog extras, so the
      # real-SDK constructor anchors in tests/test_cloud_adapters.py skip
      # there. This job installs both vendor SDKs and runs exactly those
      # anchors, so the constructor-failure contract is checked against the
      # real constructors on every push and pull request, not only on
      # machines that already have both SDKs. No key or network is needed:
      # the constructors raise before any request.
      - run: pip install -e ".[test,anthropic,openai]"
      - run: >-
          pytest -q
          tests/test_cloud_adapters.py::test_the_installed_anthropic_sdk_really_does_reject_an_unusable_base_url
          tests/test_cloud_adapters.py::test_the_installed_openai_sdk_really_does_reject_an_unusable_base_url
