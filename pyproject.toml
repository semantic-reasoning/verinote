[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verinote"
version = "0.1.0"
description = "Versioned, evidence-backed wiki with human review and Wirelog queries"
requires-python = ">=3.11"
dependencies = ["pyrewire>=1.1.2,<2", "pypdf>=5,<7"]

[project.scripts]
verinote = "verinote.server:main"

[tool.setuptools.package-data]
verinote = ["rules.dl", "web/*"]

[tool.setuptools.packages.find]
include = ["verinote*"]
