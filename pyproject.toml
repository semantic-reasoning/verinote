[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verinote"
version = "0.1.0"
description = "Versioned, evidence-backed wiki with human review and Wirelog queries"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)"]
requires-python = ">=3.11"
dependencies = ["pyrewire>=1.1.2,<2", "pypdf>=5,<7"]

[project.scripts]
verinote = "verinote.server:main"

[tool.setuptools.package-data]
verinote = ["rules.dl", "web/*", "benchmark_data/v1/*.json", "benchmark_data/repair-cases/*.json"]

[tool.setuptools.packages.find]
include = ["verinote*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
extend-ignore = ["E501", "E701", "E702"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
